
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <style>
    .spin { transform-origin: 50px 50px; animation: compass-rotate 4s linear infinite; }
    @keyframes compass-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <defs>
    <linearGradient id="silver" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="40%"  stop-color="#E2E8F0"/>
      <stop offset="80%"  stop-color="#B8C2D1"/>
      <stop offset="100%" stop-color="#7E8BA0"/>
    </linearGradient>
    <linearGradient id="silverHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g class="spin">
    <path d="M 50,4 L 54,46 L 96,50 L 54,54 L 50,96 L 46,54 L 4,50 L 46,46 Z" fill="url(#silver)"/>
    <path d="M 50,4 L 54,46 L 96,50 L 54,54 L 50,96 L 46,54 L 4,50 L 46,46 Z" fill="url(#silverHi)"/>
  </g>
</svg>